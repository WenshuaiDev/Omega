pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /health/live { access_log off; return 200 'ok'; }
    location = /APP_BASE/runtime-config.json { return 404; }
    location = /APP_BASE/index.html { alias /usr/share/nginx/html/index.html; add_header Cache-Control 'no-cache' always; }
    location ^~ /APP_BASE/assets/ {
      rewrite ^/APP_BASE/(.*)$ /$1 break;
      try_files $uri =404;
      add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location ~ ^/APP_BASE/.*\.[^/]+$ {
      rewrite ^/APP_BASE/(.*)$ /$1 break;
      try_files $uri =404;
      add_header Cache-Control 'no-cache';
    }
    location /APP_BASE/ {
      rewrite ^/APP_BASE/(.*)$ /$1 break;
      try_files $uri /APP_BASE/index.html;
      add_header Cache-Control 'no-cache' always;
    }
    location / { return 404; }
  }
}
