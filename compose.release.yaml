x-formal: &formal
  platform: linux/amd64
  pull_policy: never
services:
  db:
    <<: *formal
  api:
    <<: *formal
    user: '10001:10001'
  migrate:
    <<: *formal
    user: '10001:10001'
  web:
    <<: *formal
  console:
    <<: *formal
  edge:
    <<: *formal
    ports:
      - '${OMEGA_HTTP_PORT}:8080'
      - '${OMEGA_HTTPS_PORT}:8443'
    volumes:
      - type: bind
        source: ${OMEGA_INPUT_DIR}/tls/cert.pem
        target: /etc/omega/cert.pem
        read_only: true
      - type: bind
        source: ${OMEGA_INPUT_DIR}/.runtime-secrets/tls-key.pem
        target: /run/secrets/tls-key.pem
        read_only: true
